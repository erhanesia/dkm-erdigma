; PHP-FPM pool for DKM Erdigma.
;
; Listens on TCP rather than a socket because Nginx runs in the same container
; and supervisord starts them independently.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers periodically so a slow leak cannot accumulate.
pm.max_requests = 500

; Surface worker output in the container log.
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
