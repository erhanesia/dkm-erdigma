; Production PHP settings for DKM Erdigma.

memory_limit = 512M
max_execution_time = 120

; Audio uploads: adhan and murottal files are the largest thing users submit.
upload_max_filesize = 64M
post_max_size = 64M

date.timezone = Asia/Jakarta

; Errors go to the container log, never to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

; Sessions are stored in the database, but harden the cookie defaults anyway.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The source never changes inside an immutable image, so skip the stat() calls.
opcache.validate_timestamps = 0
opcache.save_comments = 1
