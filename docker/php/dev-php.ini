; =============================================================================
; PHP tuning for local development inside Sail
; =============================================================================
;
; The project lives on the Windows drive and is bind-mounted into the container.
; Reading a file across that boundary costs roughly 23 ms here, against 0.13 ms
; for the container's own disk — about 180x slower.
;
; Booting Laravel touches 269 files before a single line of application code
; runs, and PHP's CLI server has OPcache disabled by default, so every request
; re-read and re-parsed all of them across that slow boundary. That is what made
; each page take seconds.
;
; Enabling OPcache for the CLI SAPI keeps compiled scripts in memory, so those
; files are read once instead of once per request.
; =============================================================================

opcache.enable = 1

; `php artisan serve` runs under the CLI SAPI, which is why the usual
; `opcache.enable` alone changed nothing.
opcache.enable_cli = 1

opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000

; Timestamps must still be checked in development, otherwise edited files would
; never take effect. Checking at most once every 2 seconds keeps the stat() calls
; off the slow mount without making changes feel delayed.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Keeps doc comments, which Laravel's attribute and annotation reading relies on.
opcache.save_comments = 1

; Fewer stat() calls on a mount where each one is expensive.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
