; Runs Nginx, PHP-FPM, the queue worker, and the scheduler in one container.
;
; The scheduler matters more here than in a typical app: it is what generates
; tomorrow's playback plans and flags adhan slots that were never reported.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize
autostart = true
autorestart = true
priority = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue]
command = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user = www-data
autostart = true
autorestart = true
priority = 20
stopwaitsecs = 3600
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command = php /var/www/html/artisan schedule:work
user = www-data
autostart = true
autorestart = true
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
